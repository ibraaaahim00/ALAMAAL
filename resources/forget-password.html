<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="جسر الأمل لذوي الاحتياجات الخاصة - نسيت كلمة السر؟">
    <title>جسر الأمل | نسيت كلمة السر؟</title>

    <!-- Google Fonts: Beiruti -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Beiruti:wght@200..900&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page" id="forgetPasswordPage">

    <div class="auth-overlay"></div>

    <!-- Language Toggle -->
    <div class="auth-lang">
        <button class="navbar__lang-btn">
            <i class="fas fa-globe"></i>
            <span>العربية</span>
        </button>
    </div>

    <main class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-card__logo">
                <a href="index.html">
                    <img src="images/logo.svg" alt="جسر الأمل">
                </a>
            </div>

            <!-- Headings -->
            <div class="auth-card__header">
                <h1 class="auth-card__title">نسيت كلمة السر؟</h1>
                <p class="auth-card__subtitle">الرجاء إدخال البريد الإلكتروني الذي تستخدمه لإعادة تعيين كلمة المرور</p>
            </div>

            <!-- Form -->
            <form class="auth-form" id="forgetPasswordForm" action="otp.html">
                <div class="form-group">
                    <label for="forgetEmail">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" id="forgetEmail" placeholder="البريد الإلكتروني" required>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary auth-btn">إرسال</button>
            </form>

            <!-- Footer -->
            <div class="auth-card__footer">
                <p><a href="login.html">العودة إلى تسجيل الدخول</a></p>
            </div>
        </div>
    </main>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>
</body>

</html>
