<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="جسر الأمل لذوي الاحتياجات الخاصة - إنشاء حساب جديد">
    <title>جسر الأمل | إنشاء حساب جديد</title>

    <!-- Google Fonts: Beiruti -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Beiruti:wght@200..900&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page" id="registerPage">

    <div class="auth-overlay"></div>

    <!-- Language Toggle -->
    <div class="auth-lang">
        <button class="navbar__lang-btn">
            <i class="fas fa-globe"></i>
            <span>العربية</span>
        </button>
    </div>

    <main class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-card__logo">
                <a href="index.html">
                    <img src="images/logo.svg" alt="جسر الأمل">
                </a>
            </div>

            <!-- Headings -->
            <div class="auth-card__header">
                <h1 class="auth-card__title">سجل الآن معنا مجانا</h1>
                <p class="auth-card__subtitle">أدخل لإنشاء حساب جديد للمتابعة</p>
            </div>

            <!-- Form -->
            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label for="regName">الاسم</label>
                    <div class="input-wrapper">
                        <input type="text" id="regName" placeholder="الاسم" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regMobile">رقم الجوال</label>
                    <div class="input-wrapper">
                        <input type="tel" id="regMobile" placeholder="رقم الجوال" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">كلمة المرور</label>
                    <div class="input-wrapper">
                        <input type="password" id="regPassword" placeholder="كلمة المرور" required>
                        <button type="button" class="password-toggle" aria-label="تبديل رؤية كلمة المرور">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="auth-form__options">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="termsAgree" required>
                        <span class="checkbox-mark"></span>
                        <span class="checkbox-label">الموافقة على الشروط والأحكام</span>
                    </label>
                </div>

                <button type="submit" class="btn btn--primary auth-btn">تسجيل الدخول </button>
            </form>

            <!-- Footer -->
            <div class="auth-card__footer">
                <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
            </div>
        </div>
    </main>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>
</body>

</html>
