<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="جسر الأمل لذوي الاحتياجات الخاصة - رمز التحقق">
    <title>جسر الأمل | رمز التحقق</title>

    <!-- Google Fonts: Beiruti -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Beiruti:wght@200..900&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page" id="otpPage">

    <div class="auth-overlay"></div>

    <!-- Language Toggle -->
    <div class="auth-lang">
        <button class="navbar__lang-btn">
            <i class="fas fa-globe"></i>
            <span>العربية</span>
        </button>
    </div>

    <main class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-card__logo">
                <a href="index.html">
                    <img src="images/logo.svg" alt="جسر الأمل">
                </a>
            </div>

            <!-- Headings -->
            <div class="auth-card__header">
                <h1 class="auth-card__title">رمز التحقق</h1>
                <p class="auth-card__subtitle">الرجاء إدخال الرمز الذي أرسلناه إلى بريدك الإلكتروني</p>
                <div class="otp-timer">59:00</div>
            </div>

            <!-- Form -->
            <form class="auth-form" id="otpForm" action="reset-password.html">
                <div class="form-group">
                    <label>رمز التحقق</label>
                    <div class="otp-inputs-wrapper">
                        <input type="text" maxlength="1" class="otp-input" pattern="\d*" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-input" pattern="\d*" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-input" pattern="\d*" inputmode="numeric">
                        <input type="text" maxlength="1" class="otp-input" pattern="\d*" inputmode="numeric">
                    </div>
                </div>

                <button type="submit" class="btn btn--primary auth-btn">تحقق</button>
            </form>

            <!-- Footer -->
            <div class="auth-card__footer">
                <p><a href="#" class="resend-link">إعادة إرسال الرمز</a></p>
            </div>
        </div>
    </main>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>
</body>

</html>
