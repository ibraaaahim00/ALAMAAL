<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="جسر الأمل لذوي الاحتياجات الخاصة - إعادة تعيين كلمة المرور">
    <title>جسر الأمل | إعادة تعيين كلمة المرور</title>

    <!-- Google Fonts: Beiruti -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Beiruti:wght@200..900&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page" id="resetPasswordPage">

    <div class="auth-overlay"></div>

    <!-- Language Toggle -->
    <div class="auth-lang">
        <button class="navbar__lang-btn">
            <i class="fas fa-globe"></i>
            <span>العربية</span>
        </button>
    </div>

    <main class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-card__logo">
                <a href="index.html">
                    <img src="images/logo.svg" alt="جسر الأمل">
                </a>
            </div>

            <!-- Headings -->
            <div class="auth-card__header">
                <h1 class="auth-card__title">إعادة تعيين كلمة المرور</h1>
                <p class="auth-card__subtitle">الرجاء إدخال كلمة المرور الجديدة</p>
            </div>

            <!-- Form -->
            <form class="auth-form" id="resetPasswordForm" action="login.html">
                <div class="form-group">
                    <label for="newPassword">كلمة المرور الجديدة</label>
                    <div class="input-wrapper">
                        <input type="password" id="newPassword" placeholder="أدخل كلمة المرور الجديدة" required>
                        <button type="button" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" placeholder="أدخل تأكيد كلمة المرور الجديدة"
                            required>
                        <button type="button" class="password-toggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn--primary auth-btn">حفظ</button>
            </form>
        </div>
    </main>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>
</body>

</html>
